  min_buy_usd: 300                # kleinere Käufe ignorieren (Spam / Airdrops)
  single_alerts: "off"            # einzelne Wallet-Käufe: private | channel | off
  sell_alerts: false              # einzelne Verkäufe melden?
  cluster_min_wallets: 3          # ab so vielen Wallets im selben Coin -> SMART-MONEY-CALL in den Kanal
  cluster_hours: 12               # Zeitfenster dafür
