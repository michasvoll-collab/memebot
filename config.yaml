# ============================================================
#  MemeBot – Einstellungen
#  Geheime Schlüssel (Telegram-Token, API-Keys) gehören in die
#  Datei .env – NICHT hier rein.
# ============================================================

# Welche Blockchains beobachtet werden (einfach Zeilen löschen/auskommentieren)
chains:
  - solana
  - ethereum
  - base
  - bsc
  - arbitrum

# Wie oft (Sekunden) nach neuen Coins gesucht wird
scan_interval_sec: 45
# Wie oft (Sekunden) noch nicht passende Coins erneut geprüft werden
recheck_interval_sec: 180
# Wie lange (Stunden) ein neuer Coin maximal beobachtet wird
max_watch_hours: 8
# Wie viele Coins pro Durchlauf geprüft werden
batch_per_cycle: 150

# ------------------------------------------------------------
# Markt-Kriterien – ALLE müssen erfüllt sein
# ------------------------------------------------------------
market:
  min_liquidity_usd: 15000        # genug Liquidität, damit du wieder rauskommst
  max_liquidity_usd: 5000000
  min_market_cap_usd: 30000
  max_market_cap_usd: 250000      # Tag-1-Auswertung: über 250K stürzten 73 % ab
  min_age_minutes: 30             # Tag 1: unter 30 min stürzten 77 % ab
  max_age_hours: 72
  min_volume_1h_usd: 10000
  min_txns_1h: 50                 # Käufe + Verkäufe in der letzten Stunde
  min_buy_sell_ratio_1h: 0.8      # Käufe / Verkäufe (unter 1 = mehr Verkäufe)
  max_buy_sell_ratio_1h: 3.0      # mehr als 3x so viele Käufe = meist Bot-Volumen (Tag 1: 90 % abgestürzt)
  max_price_rise_1h_pct: 200      # schon >200 % in 1h gepumpt = zu spät (Tag 1: 85 % abgestürzt)
  max_price_drop_1h_pct: -40      # schon >40 % gefallen in 1h -> raus
  # --- v5, aus der Auswertung von Tag 2 ---
  max_turnover_1h: 4              # Volumen 1h > 4x Liquidität = Wash-Trading (46 % tot)
  max_chg_5m_pct: 20              # gerade +20 % in 5 min = Spike, nicht hinterherkaufen (0 % schafften 2x)
  min_chg_5m_pct: -15             # fällt gerade stark
  min_age_minutes_hype: 10        # Coins aus X/Telegram-Hype dürfen schon ab 10 min gemeldet werden

# ------------------------------------------------------------
# Sicherheits-Kriterien (Honeypot / Rug Pull)
# ------------------------------------------------------------
security:
  max_buy_tax_pct: 10
  max_sell_tax_pct: 10
  max_top10_holders_pct: 35       # Top-10-Wallets (ohne LP/Burn) dürfen max. so viel halten
  max_single_holder_pct: 12
  max_creator_pct: 5
  min_lp_locked_pct: 80           # Liquidität muss zu min. 80 % gesperrt/verbrannt sein
  require_renounced_or_no_mint: true   # EVM: Owner abgegeben ODER keine Mint-Funktion
  require_open_source: true             # EVM: Vertrag muss verifiziert sein
  solana_require_no_mint_authority: true
  solana_require_no_freeze_authority: true
  solana_max_rugcheck_score: 1000       # RugCheck-Risiko-Score (niedriger = sicherer)
  max_insiders: 20                      # ab 20 Insider-/Bundle-Wallets: kein Call (Tag 2: -16 %)
  max_dev_tokens: 5                     # Ersteller hat schon 5+ Coins gemacht -> Abzug

# Mindest-Gesamtpunktzahl (0–100) für einen Alarm
min_score: 65
# Mindest-Markt-Punkte (Tag 2: unter 70 lief es deutlich schlechter)
min_market_score: 70
# Gewichtung der Gesamtpunkte – Hype zählt am meisten
score_weights:
  security: 0.35
  market: 0.25
  hype: 0.40
# Coin muss nach so vielen Minuten IMMER NOCH alles erfüllen, bevor er gemeldet wird
confirm_minutes: 15
# Ab diesem Hype-Wert wird sofort gemeldet (keine Wartezeit) -> "⚡ HYPE-CALL"
fast_lane_hype: 80
# Punktabzug je nach Fundort (Tag 2: "DexScreener neu" nur 8 % Treffer)
source_penalty:
  DexScreener neu: 8

# ------------------------------------------------------------
# Wallet-Tracking
# ------------------------------------------------------------
wallets:
