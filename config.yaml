# ------------------------------------------------------------
# Call-Tracking (MC beim Call, Hoch danach, x-Faktor)
# ------------------------------------------------------------
tracker:
  interval_sec: 90        # wie oft die Preise gemeldeter Coins geprüft werden
  track_days: 14          # wie lange ein Call verfolgt wird
  # Meldungen bei 2x, 3x, 5x, 10x, 20x, 50x, 100x kommen automatisch

# ------------------------------------------------------------
# News & Hype
# ------------------------------------------------------------
news:
  enabled: true
  interval_min: 10
  # Kurzer Trend-Überblick per Telegram (0 = aus)
  digest_every_hours: 6
  feeds:
    - https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en
    - https://cointelegraph.com/rss
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://decrypt.co/feed
    - https://news.google.com/rss/headlines/section/topic/NATION?hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/search?q=Trump+when:1d&hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/search?q=Elon+Musk+when:1d&hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/search?q=memecoin+OR+%22meme+coin%22+when:1d&hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/search?q=viral+when:1d&hl=en-US&gl=US&ceid=US:en

# ------------------------------------------------------------
# KI-Analyse (Claude)
# ------------------------------------------------------------
ai:
  enabled: true
  analysis_model: claude-haiku-5-5    # günstig; für bessere Texte: claude-sonnet-5-5
  trend_model: claude-haiku-5-5       # günstig: extrahiert Trend-Stichwörter aus News
  web_search: true                    # Claude darf selbst im Web/X nach dem Coin suchen
  web_search_max_uses: 2
  max_analyses_per_hour: 10           # Kostenbremse Coin-Analysen
  max_trend_calls_per_hour: 6         # News-Trends
  max_x_calls_per_hour: 12            # Stichwörter aus Promi-Posts
  cache_minutes: 180                  # gleiche Coin-Analyse nicht doppelt bezahlen

# ------------------------------------------------------------
# X / Twitter (twitterapi.io – Schlüssel per /x_key im Bot)
# ------------------------------------------------------------
x:
  enabled: true
  interval_sec: 180          # wie oft die Promi-/KOL-Accounts gelesen werden
  buzz_pages: 1              # 1 Seite = bis 20 Posts pro Coin-Messung
  max_coin_age_hours: 6      # nur frische Coins zu Promi-Posts suchen
  accounts:                  # ändern mit /set x.accounts name1,name2,...
